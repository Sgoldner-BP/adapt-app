<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>ADAPT Resilience</title>
<meta name="theme-color" content="#d8f0fc">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
/* Fonts hosted with the app (SIL Open Font License; see fonts/). No requests to Google. */
@font-face{font-family:'Archivo';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/archivo-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Archivo';font-style:normal;font-weight:800;font-display:swap;src:url(fonts/archivo-latin-800-normal.woff2) format('woff2')}
@font-face{font-family:'Source Sans 3';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/source-sans-3-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Source Sans 3';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/source-sans-3-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Source Sans 3';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/source-sans-3-latin-700-normal.woff2) format('woff2')}

/* Layout: one phone-width column, step-by-step cards, fixed bottom tab bar. Colors: Aaron's brand blues from his Instagram graphics (pale #d8f0fc, deep #06669c) + orange accents #e8692a (option A, Oct 22; revisit later). Buttons use the deep blue; green = done/pain-free, red only for emergencies. */
:root{
  --bg:#f4f9fc; --surface:#ffffff; --fg:#1b1e21; --muted:#5d656c; --line:#dadfe3; --soft:#eef0f2;
  --accent:#06669c; --accent-ink:#ffffff; --orange:#e8692a; --accent-text:#b4501d; --accent-soft:#fdeee5;
  --blue:#06669c; --blue-light:#d8f0fc; --blue-line:#9fd3ec; --blue-soft:#d8f0fc;
  --good:#1d8f37; --good-soft:#e2f4e6; --warn:#b4501d; --warn-soft:#fdeee5; --alert:#b3161b; --alert-soft:#fde4e3; --mid:#8a6a00; --mid-soft:#fff3c4;
  --display:"Archivo", "Arial Black", Arial, sans-serif;
  --body:"Source Sans 3", "Segoe UI", Arial, sans-serif;
  --navh:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111618; --surface:#1b1e21; --fg:#e8eaec; --muted:#9aa3ab; --line:#2e3338; --soft:#23272b;
  --accent:#8fd0f2; --accent-ink:#111618; --orange:#f08a52; --accent-text:#f5a070; --accent-soft:#3a2418;
  --blue:#8fd0f2; --blue-light:#24485c; --blue-line:#3b6a82; --blue-soft:#163242;
  --good:#5ccf7a; --good-soft:#1c3324; --warn:#f5a070; --warn-soft:#3a2418; --alert:#ff7b78; --alert-soft:#3d1c1c; --mid:#f2c94c; --mid-soft:#3a3115; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111618; --surface:#1b1e21; --fg:#e8eaec; --muted:#9aa3ab; --line:#2e3338; --soft:#23272b;
  --accent:#8fd0f2; --accent-ink:#111618; --orange:#f08a52; --accent-text:#f5a070; --accent-soft:#3a2418;
  --blue:#8fd0f2; --blue-light:#24485c; --blue-line:#3b6a82; --blue-soft:#163242;
  --good:#5ccf7a; --good-soft:#1c3324; --warn:#f5a070; --warn-soft:#3a2418; --alert:#ff7b78; --alert-soft:#3d1c1c; --mid:#f2c94c; --mid-soft:#3a3115; color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
html{scroll-padding-bottom:calc(var(--navh) + env(safe-area-inset-bottom, 0px) + 16px);scroll-padding-top:16px}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:0 calc(var(--navh) + env(safe-area-inset-bottom, 0px) + 24px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:10;background:var(--bg)}
main{max-width:640px;margin:0 auto}
h1,h2,h3{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:1.7rem;font-weight:800}
h2{font-size:1.25rem;font-weight:800}
h3{font-size:1.02rem;font-weight:600}
p{margin:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:18px 10px;border-bottom:3px solid var(--blue-light);margin-bottom:14px}
.brand{font-family:var(--display);font-weight:800;letter-spacing:.06em;color:var(--blue);font-size:.95rem}
.who{font-size:.85rem;color:var(--muted);text-align:right;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stack{display:grid;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;gap:12px;min-width:0}
.card.flat{background:transparent;border:0;padding:0}
.eyebrow{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--blue);font-weight:700}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.fine{font-size:.8rem;color:var(--muted)}
img.fig{width:100%;max-width:100%;height:auto;border-radius:8px;border:1px solid var(--line);background:#fff}
.btn{font:inherit;font-weight:700;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);padding:11px 16px;cursor:pointer;text-align:center;min-height:44px}
.btn.ghost{background:transparent;color:var(--accent-text);border:2px solid var(--orange)}
.btn.plain{background:var(--soft);color:var(--fg);border-color:var(--line)}
.btn.small{padding:6px 10px;min-height:34px;font-size:.88rem}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row.spread{justify-content:space-between}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
label.f{display:grid;gap:6px;font-weight:600;font-size:.95rem}
label.f .hint{font-weight:400;color:var(--muted);font-size:.86rem}
input[type=text],input[type=date],input[type=number],textarea,select{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%;min-width:0}
textarea{min-height:76px;resize:vertical}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.scale{display:grid;grid-template-columns:repeat(11,1fr);gap:4px}
.scale button{font:inherit;font-variant-numeric:tabular-nums;font-weight:700;min-height:40px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;padding:0}
.scale button[aria-pressed="true"]{color:#fff;border-color:transparent}
@media (max-width:520px){.scale{grid-template-columns:repeat(6,1fr);gap:6px}.scale button{min-height:44px}}
.scale-ends{display:flex;justify-content:space-between;font-size:.78rem;color:var(--muted)}
.yn{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding-block:10px;border-top:1px solid var(--line)}
.yn:first-of-type{border-top:0}
.yn .q{min-width:0}
.yn .btns{display:flex;gap:6px}
.yn button{font:inherit;font-weight:700;min-width:54px;min-height:40px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.yn button[aria-pressed="true"][data-v="yes"]{background:var(--alert-soft);border-color:var(--alert);color:var(--alert)}
.yn button[aria-pressed="true"][data-v="no"]{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.msg{border-radius:8px;padding:14px;display:grid;gap:10px;border:1px solid}
.msg.alert{background:var(--alert-soft);border:2px solid var(--alert);border-left-width:7px;color:var(--alert);font-weight:700}
.msg.alert a{color:inherit}
.msg.warn{background:var(--warn-soft);border-color:var(--warn)}
.msg.good{background:var(--good-soft);border-color:var(--good)}
.msg.info{background:var(--blue-soft);border-color:var(--blue-line)}
.rule{background:var(--accent-soft);border-left:4px solid var(--orange);border-radius:6px;padding:12px 14px;display:grid;gap:4px}
.steps{display:grid;gap:8px}
.stepbtn{display:grid;grid-template-columns:36px 1fr auto;gap:12px;align-items:center;text-align:left;font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;cursor:pointer;min-width:0}
.stepnum{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;background:var(--soft);color:var(--muted)}
.stepbtn[data-done="true"] .stepnum{background:var(--good);color:#fff}
.stepnum{border:2px solid var(--blue-line)}
.lchk{display:inline-grid;place-items:center;width:20px;height:20px;margin-right:8px;border-radius:50%;border:2px solid var(--blue-line);font-size:12px;vertical-align:-3px}
.lchk[data-done="true"]{background:var(--good);border-color:var(--good);color:#fff}
.stepbtn[data-done="true"] .stepnum{border-color:var(--good)}
.stepbtn .t{min-width:0}
.stepbtn .t b{display:block}
.stepbtn .t span{font-size:.86rem;color:var(--muted);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chev{color:var(--muted);font-weight:700}
.today{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.done-btn{font:inherit;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:10px;padding:12px;cursor:pointer;display:grid;gap:4px;min-height:84px;min-width:0}
.done-btn b{font-family:var(--display);font-size:.95rem}
.done-btn span{font-size:.85rem;color:var(--muted);overflow-wrap:anywhere}
.done-btn[aria-pressed="true"]{background:var(--good-soft);border-color:var(--good)}
.done-btn:disabled{opacity:.6;cursor:default}
.linkbtn{font:inherit;background:none;border:0;padding:0;color:var(--blue);text-decoration:underline;cursor:pointer;text-align:left}
.done-btn[aria-pressed="true"] .state{color:var(--good)}
.state{font-weight:700;font-size:.85rem}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:.75rem;color:var(--muted)}
.week .d{display:grid;gap:3px;justify-items:center}
.dot{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--line);background:transparent}
.tour-dots{display:flex;gap:8px;justify-content:center;margin:4px 0}
.tour-dots span{width:9px;height:9px;border-radius:50%;background:var(--line)}
.tour-dots span.on{background:var(--blue)}
.tour ul{margin:0;padding-left:20px;display:grid;gap:6px}
.tour p{margin:0}
.dot.on{background:var(--good);border-color:var(--good)}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.88rem;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top;white-space:nowrap}
td.wrap{white-space:normal;min-width:120px}
th{font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.chip{display:inline-block;font-size:.78rem;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--muted)}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.due{background:var(--warn-soft);color:var(--warn)}
.chip.alert{background:var(--alert-soft);color:var(--alert)}
.chip.mid{background:var(--mid-soft);color:var(--mid)}
.tr{display:inline-block;font-size:.75rem;font-weight:700;padding:1px 7px;border-radius:999px;white-space:nowrap}
.tr.progressed{background:var(--good-soft);color:var(--good)} .tr.same{background:var(--mid-soft);color:var(--mid)} .tr.regressed{background:var(--alert-soft);color:var(--alert)} .tr.unclear{background:var(--soft);color:var(--muted)}
.trend-pick{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.trend-pick button{font:inherit;font-size:.85rem;font-weight:700;min-height:44px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;padding:4px}
.trend-pick button[aria-pressed="true"][data-v="progressed"]{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.trend-pick button[aria-pressed="true"][data-v="same"]{background:var(--mid-soft);border-color:var(--mid);color:var(--mid)}
.trend-pick button[aria-pressed="true"][data-v="regressed"]{background:var(--alert-soft);border-color:var(--alert);color:var(--alert)}
.trend-pick button[aria-pressed="true"][data-v="unclear"]{background:var(--soft);border-color:var(--muted)}
@media (max-width:380px){.trend-pick{grid-template-columns:repeat(2,1fr)}}
.trend-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.days14{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.days14 button{font:inherit;font-size:.75rem;color:var(--muted);border:1px solid var(--line);background:var(--surface);border-radius:8px;min-height:52px;display:grid;gap:3px;justify-items:center;align-content:center;padding:4px 0;cursor:pointer}
.days14 button[aria-pressed="true"]{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue-line)}
.days14 .dd{display:flex;gap:3px}
.days14 .dot{width:10px;height:10px}
details{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:0 16px}
details[open]{padding-bottom:16px}
summary{cursor:pointer;font-family:var(--display);font-weight:600;padding-block:14px;list-style:none;display:flex;justify-content:space-between;gap:10px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";color:var(--accent-text);font-weight:800}
details[open] summary::after{content:"\2212"}
details .body{display:grid;gap:10px}
ul.tight{margin:0;padding-left:20px;display:grid;gap:4px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom, 0px);padding-left:env(safe-area-inset-left, 0px);padding-right:env(safe-area-inset-right, 0px)}
nav.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--navh)}
nav.tabs button{font:inherit;font-size:.78rem;font-weight:700;background:none;border:0;color:var(--muted);cursor:pointer;display:grid;place-items:center;gap:2px;padding:6px 2px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--blue)}
nav.tabs{border-top:3px solid var(--blue-light)}
.spark{width:100%;height:auto;display:block}
.code{font-family:ui-monospace,Menlo,monospace;font-size:.8rem;word-break:break-all;background:var(--soft);border-radius:6px;padding:8px;max-height:120px;overflow:auto}
.hero{display:grid;gap:12px;padding-block:24px 4px}
.hero-title{color:var(--blue);font-size:1.9rem;padding-bottom:10px;border-bottom:3px solid var(--orange);text-align:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--navh) + env(safe-area-inset-bottom, 0px) + 14px);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:8px;font-weight:600;z-index:30;font-size:.9rem}
.sep{height:1px;background:var(--line)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

</head>
<body>
<main id="app" aria-live="polite"></main>
<nav class="tabs" id="tabs" aria-label="Main" hidden><div class="in">
  <button data-act="tab" data-v="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 11l8-7 8 7v9h-5v-6h-6v6H4z"/></svg>Plan</button>
  <button data-act="tab" data-v="steps"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 6h14M5 12h14M5 18h9"/></svg>Steps</button>
  <button data-act="tab" data-v="learn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h7a3 3 0 013 3v12a2 2 0 00-2-2H4zM20 5h-6"/><path d="M14 8a3 3 0 013-3h3v13h-6"/></svg>Learn</button>
  <button data-act="tab" data-v="checkin"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12l16-8-6 16-3-6z"/></svg>Check-in</button>
  <button data-act="tab" data-v="more"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>More</button>
</div></nav>

<script>
"use strict";
/* ---------- Fixed wording (01_ADAPT_Method_Source_of_Truth, sections 3 and 6) ---------- */
const DISCLAIMER = "All information gathered and recommendations given do not constitute medical advice. While we think it is spectacular and supremely helpful, anyone utilizing the pearls of wisdom contained within is doing so volitionally and is personally assuming all risk.";
const CONFIDENTIAL = "We will treat all your information as confidential and not reveal it unnecessarily.";
const SCREEN_DISCLAIMER = "This table cannot be used to definitively determine what you do/do not have or the severity of it. That can only be done under the direct care of a medical provider. Seek care if you feel you should. You are assuming your own risk with whatever actions you take.";
const UPGRADE_LINK = ""; // add the upgrade URL here when it exists
const MSG_INPERSON_A = "Based on your selection, we officially advise that you follow up with a medical professional for additional support and screening. That could be in-person, or you can get personalized guidance from our ADAPT team ";
const MSG_INPERSON_B = ". There is plenty you can learn from reading through the remainder of the ADAPT protocol, though, and you can use your judgement as to what questions you can still answer.";
const MSG_TAG_SAM = "Your answers are flagged for Sam. Send them to him so he can follow up with you."; // Sam approved Oct 22, 2026
const RED_FLAGS = [
"Significant pain at rest",
"Pain that spikes during activities to overwhelming levels and then stays flared at rest",
"Significant decrease to range of motion, strength, and/or stability in affected area and surrounding/related areas",
"Significant bruising unrelated to hard contact",
"Significant/persistent/recurrent swelling",
"A gap/dent/divot in affected tissue",
"Numbness and/or tingling",
"Changes in vision, hearing, speech, balance/dizziness, control of limb(s), bowel/bladder control, sexual function",
"Inability to bear weight on affected limb",
"Unexplained nausea, vomiting, and/or diarrhea",
"Unexplained changes in appetite",
"Unexplained significant weight loss",
"Unexplained recurrent night sweats",
"Fever",
"Unexplained fatigue",
"Atypical shortness of breath",
"Pain that migrates to seemingly unrelated locations",
"Worsening of current symptoms/onset of new symptoms despite appropriate self-care",
"Recent surgical procedure in any body region",
"Prior surgical procedure in painful body region"];
const EMERGENCY_FLAGS = [8,10,16]; // plus health question 3 (overlaps red flag 8). Sam, October 23, 2026: no separate emergency outcome; these add MSG_RIGHT_NOW
const EMERGENCY_HH = [3];
const MSG_RIGHT_NOW = "If you are experiencing these symptoms right now, we officially advise that you IMMEDIATELY follow up in-person with a medical professional, as this may be an EMERGENCY.";
const HEALTH_SHORT = ["heart condition or high blood pressure","chest pain","dizziness or loss of consciousness","other chronic medical condition","prescribed medication for a chronic condition","regular over-the-counter medication","doctor advised medically supervised activity only"];
const HEALTH = [
"Has your doctor ever said that you have a heart condition OR high blood pressure?",
"Do you feel pain in your chest at rest, during your daily activities of living, OR when you do physical activity?",
"Do you lose balance because of dizziness OR have you lost consciousness in the last 12 months?",
"Have you ever been diagnosed with another chronic medical condition (other than heart disease or high blood pressure)?",
"Are you currently taking prescribed medications for a chronic medical condition?",
"Are you currently taking any over-the-counter medications regularly for pain or any medical conditions?",
"Has your doctor ever said that you should only do medically supervised physical activity?"];

/* ---------- Storage ---------- */
const KEY = "adapt-app-v1";
let store = { activeId:null, plans:{}, clients:{} };
let saveOk = true;
function load(){ try{ const s = JSON.parse(localStorage.getItem(KEY)||"null"); if(s && s.plans) store = Object.assign({activeId:null,plans:{},clients:{}}, s); Object.values(store.plans).forEach(x=>{ if(x.region in OLD_REGION) x.region=OLD_REGION[x.region]; }); }catch(e){ saveOk=false; } }
let saveTimer = null;
function save(now){ clearTimeout(saveTimer); const run=()=>{ try{ localStorage.setItem(KEY, JSON.stringify(store)); saveOk=true; }catch(e){ saveOk=false; } }; if(now) run(); else saveTimer=setTimeout(run,300); }

const uid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);
function today(){ const d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); }
function addDays(iso,n){ const d=new Date(iso+"T12:00:00"); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
function daysBetween(a,b){ return Math.round((new Date(b+"T12:00:00")-new Date(a+"T12:00:00"))/86400000); }
function fmtDate(iso){ if(!iso) return ""; const d=new Date(iso+"T12:00:00"); return d.toLocaleDateString(undefined,{month:"short",day:"numeric"}); }

function newPlan(o={}){
  return Object.assign({
    id:uid(), v:1, created:today(), person:"", last:"", side:"", region:"", support:"self", origin:"self",
    screen:{ rf:{}, hh:{}, done:false, date:null },
    assess:{ kind:"painful", start:"", how:"", recent:"", nrsop:null, skill:"", inhibited:"", pct:"", psfs:null, goal:"" },
    determine:{ crux:"", move:"", dose:"", range:"", load:"", nrsop:null },
    approach:{ pfm:"", cc:"" },
    program:{ ov:"", replaces:"", skip:false },
    tracking:false,
    logs:{ daily:{}, tests:[], overload:[], skill:[] },
    note:""
  }, o);
}
const P = () => store.plans[store.activeId];

/* ---------- Packing for links (plan travels in the link; never sent to a server) ---------- */
function b64url(bytes){ let s=""; bytes.forEach(b=>s+=String.fromCharCode(b)); return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); }
function unb64url(str){ str=str.replace(/-/g,"+").replace(/_/g,"/"); while(str.length%4) str+="="; const bin=atob(str); return Uint8Array.from(bin,c=>c.charCodeAt(0)); }
async function pack(obj){
  const bytes = new TextEncoder().encode(JSON.stringify(obj));
  if("CompressionStream" in window){ try{
    const out = await new Response(new Blob([bytes]).stream().pipeThrough(new CompressionStream("deflate-raw"))).arrayBuffer();
    return "z"+b64url(new Uint8Array(out)); }catch(e){} }
  return "j"+b64url(bytes);
}
async function unpack(code){
  code = code.trim();
  const m = code.match(/#([cpr])=([A-Za-z0-9_-]+)/); if(m) code = m[2];
  const kind = code[0], body = code.slice(1);
  let bytes = unb64url(body);
  if(kind==="z"){ bytes = new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).arrayBuffer()); }
  else if(kind!=="j") throw new Error("not a code");
  return JSON.parse(new TextDecoder().decode(bytes));
}

function scaleColor(n, kind){ // NRSoP: 0 green to 10 red; PSFS: 0 red to 10 green
  const t = kind==="psfs" ? (10-n)/10 : n/10;
  const h = Math.round(130 - 130*t); return `hsl(${h} 62% 40%)`;
}
function scale(path, val, kind){

  const ends = kind==="psfs" ? ["Completely limited","Completely unlimited"] : ["No pain","Worst pain"];
  return `<div class="scale" role="group">${btns}</div><div class="scale-ends"><span>0: ${ends[0]}</span><span>10: ${ends[1]}</span></div>`;
}

}

function screenResult(p){
  const rf=p.screen.rf, hh=p.screen.hh;
  const yesRF = Object.keys(rf).filter(k=>rf[k]==="yes").map(Number);
  const yesHH = Object.keys(hh).filter(k=>hh[k]==="yes").map(Number);
  const emergency = [...yesRF.filter(n=>EMERGENCY_FLAGS.includes(n)).map(n=>"rf"+n), ...yesHH.filter(n=>EMERGENCY_HH.includes(n)).map(n=>"hh"+n)];
  const other = yesRF.filter(n=>!EMERGENCY_FLAGS.includes(n));
  const answered = Object.keys(rf).length===RED_FLAGS.length && Object.keys(hh).length===HEALTH.length;
  return { yesRF, yesHH, emergency, other, any: yesRF.length+yesHH.length>0, answered };
}

function testsSinceBase(p){ const a=p.tmBase&&p.tmBase.after; return p.logs.tests.filter(t=>!a||t.date>a); }
function ceilingCheck(p){ const T=testsSinceBase(p); const last2=T.slice(-2);
  const on = last2.length===2 && last2.every(t=> isPainful(p) ? t.nrsop===0 : t.free===true);
  return on ? {since:last2[0].date, key:last2[1].date} : null; }
// Stall ladder (Sam, October 26, 2026; awaiting Aaron): each stalled check (2 rated tests without Progressed)
// looks at the 2 weeks before it. Missing movement: find it (no step). Under the consistency target: target prompt,
// up to 2 in a row; the 3rd in a row moves on to exercise changes. On target: next rung. Rungs: change #1, #2, #3, then referral.
const MOVES=[["pfm","Pain-Free Motion"],["cc","Comfortable Contraction"],["ov","Overload Exercise"]];
function countsAt(p,end){ const hasP=!!p.approach.pfm.trim(), hasC=!!p.approach.cc.trim(); let d=0;
  for(let i=0;i<14;i++){ const x=p.logs.daily[addDays(end,-i)]||{}; if((hasP||hasC)&&(!hasP||x.pfm)&&(!hasC||x.cc)) d++; }
  const o=p.logs.overload.filter(r=>{ const k=daysBetween(r.date,end); return k>=0&&k<14; }).length;
  return {d,o}; }
function progressCheck(p){ const ceil=ceilingCheck(p);
  if(ceil) return {stalled:false, refer:false, regressed:false, checks:0, key:null, ceiling:ceil};
  const L=testsSinceBase(p).filter(t=>t.trend); let run=0; for(let i=L.length-1;i>=0&&L[i].trend!=="progressed";i--) run++;
  const checks=Math.floor(run/2); const last2=L.slice(-2);
  const regressed=last2.length===2&&last2.every(t=>t.trend==="regressed");
  if(!checks) return {stalled:false, refer:false, regressed, checks:0, key:null};
  const ep=L.slice(L.length-run), epStart=ep[0].date, lad=p.ladder||{}, miss=missingMoves(p).length>0;
  let rung=0, under=0, refer=false, step=null, outcome=null;
  for(let k=1;k<=checks;k++){
    const t=ep[2*k-1], key=epStart+":"+k, last=k===checks;
    let o=lad[key]; if(!o){ if(last&&miss) o="M"; else { const c=countsAt(p,t.date); o=(c.d>=10&&c.o>=6)?"C":"I"; } }
    if(last) outcome=o;
    if(refer) step={type:"refer"};
    else if(o==="M") step={type:"missing"};
    else if(o==="I"&&under<2){ under++; const c=countsAt(p,t.date), pv=countsAt(p,addDays(t.date,-14)); step={type:"target", second:under===2, T:(under===2&&(c.d<8||c.o<4))?[8,2]:[10,3], c, pv, date:t.date}; }
    else { under = o==="I" ? under+1 : 0; rung++; if(rung>3){ refer=true; step={type:"refer"}; } else step={type:"change", rung, date:t.date}; }
  }
  return {stalled:true, refer, regressed, checks, rung, step, outcome, epStart, key: epStart+":"+checks}; }
function freezeCheck(p){ const c=progressCheck(p); if(c.stalled&&c.key&&c.outcome){ p.ladder=p.ladder||{}; p.ladder[c.key]=c.outcome; } }
function changedSince(p,since){ return (p.changed||[]).filter(x=>x.date>=since); }
// Movements still to find: the first exercise adjustment (Sam)
function missingMoves(p){ const m=[];
  if(!p.approach.pfm.trim()) m.push(["step3","Pain-Free Motion"]);
  if(!p.approach.cc.trim()) m.push(["step3","Comfortable Contraction"]);
  if(!p.program.ov.trim()||p.program.skip) m.push(["step4","Overload Exercise"]);
  return m; }
function missingPhrase(m){ const and=a=>a.length<2?a[0]:a.slice(0,-1).join(", ")+" and "+a[a.length-1];
  const g={}; m.forEach(([s,l])=>{(g[s]=g[s]||[]).push(l);});
  return and(Object.keys(g).map(s=>and(g[s])+" (Step "+s.slice(-1)+")")); }
// Consistency over a 14-day window ending `back` days ago: a day counts when every daily movement that is set was done
function windowCounts(p, back){ const t=today(); const hasP=!!p.approach.pfm.trim(), hasC=!!p.approach.cc.trim(); let d=0;
  for(let i=back;i<back+14;i++){ const x=p.logs.daily[addDays(t,-i)]||{}; if((hasP||hasC)&&(!hasP||x.pfm)&&(!hasC||x.cc)) d++; }
  const o=p.logs.overload.filter(r=>{ const k=daysBetween(r.date,t); return k>=back&&k<back+14; }).length;
  return {d,o}; }
const times = n => n===1?"1 time":n+" times";
// The person's own movement next to its label, once they've filled it in (Sam, October 27, 2026)
function mvn(p,k){ const l=MOVES.find(m=>m[0]===k)[1]; const n=(k==="pfm"?p.approach.pfm:k==="cc"?p.approach.cc:(p.program.skip?"":p.program.ov)||"").trim(); return n?`${l} (${n})`:l; }
const allThree = p => `your ${mvn(p,"pfm")}, ${mvn(p,"cc")}, or ${mvn(p,"ov")}`;
function stallMsg(p,c){
  const st=c.step||{};
  if(st.type==="missing"){ const miss=missingMoves(p); if(miss.length) return `Your last two weekly tests didn’t show progress. First, find your ${missingPhrase(miss)}; that’s the first adjustment to make. Keep the Testing Movement the same so you can see whether the change helps.`; }
  if(st.type==="target"){ const cur=st.c;
    if(!st.second) return `Your last two weekly tests didn’t show progress. Over the last 2 weeks you did your daily movements on ${cur.d} of 14 days and your Overload Exercise ${times(cur.o)}. For the next 2 weeks, aim for your daily movements on at least 10 days and your Overload Exercise 3 times a week, and keep everything else the same.`;
    const prev=st.pv, ud=cur.d>prev.d, uo=cur.o>prev.o;
    const up = ud&&uo ? `, up from ${prev.d} days and ${times(prev.o)} before, so the extra effort is showing` : ud ? `, up from ${prev.d} days before, so the extra effort is showing` : uo ? `, up from ${times(prev.o)} before, so the extra effort is showing` : "";
    return `Your tests still haven’t shown progress. Over the last 2 weeks you did your daily movements on ${cur.d} of 14 days and your Overload Exercise ${times(cur.o)}${up}. For the next 2 weeks, aim for your daily movements on at least ${st.T[0]} days and your Overload Exercise ${st.T[1]} times a week. If hitting that doesn’t help, the next adjustment we’ll make is changing the exercises themselves.`; }
  const done=changedSince(p,c.epStart||"").map(x=>x.k), rem=MOVES.filter(([k])=>!done.includes(k)).map(x=>mvn(p,x[0]));
  const tail=" Keep the Testing Movement the same so you can see whether the change helps.";
  if(rem.length===2) return `Your last two weekly tests didn’t show progress. Time to change one of the two you haven’t changed yet: your ${rem[0]} or ${rem[1]}.`+tail;
  if(rem.length===1) return `Your last two weekly tests didn’t show progress. Time to change the last one: your ${rem[0]}.`+tail;
  if(rem.length===0) return `Your last two weekly tests didn’t show progress. Time to change one thing again: ${allThree(p)}.`+tail;
  return MSG_TWO_WEEK.replace("your Pain-Free Motion, Comfortable Contraction, or Overload Exercise", allThree(p)); }
function changePick(p,c){ const st=c.step||{}; if(st.type!=="change") return "";
  const mine=changedSince(p,st.date); if(mine.length) return `<p class="small"><b>Changed:</b> your ${esc(MOVES.find(m=>m[0]===mine[mine.length-1].k)[1])} (${esc(fmtDate(mine[mine.length-1].date))}).</p>`;
  const done=changedSince(p,c.epStart||"").map(x=>x.k), rem=MOVES.filter(([k])=>!done.includes(k));
  return `<p class="small">Which did you change?</p><div class="row">${(rem.length?rem:MOVES).map(([k,l])=>`<button class="btn small plain" data-act="changed" data-v="${k}">${l}</button>`).join("")}</div>`; }
function ceilingMsg(p,ceil){

function queueWin(p){ (store.outbox=store.outbox||[]).push({client:planCode(p)||"(no name)", step:"11/10 win", at:new Date().toISOString()}); save(true); flushFlags(); }
function checkScreenFlag(p){ if(!p||!screenResult(p).answered) return; const sig=screenSig(p); p.notified=p.notified||{}; if(sig && sig!==p.notified.screen) queueFlag(p,"Pre-ADAPT Screening"); p.notified.screen=sig; save(true); }
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="hidden" && view==="screen") checkScreenFlag(P()); });
function screenSig(p){ const r=screenResult(p); return r.any ? [...r.yesRF.map(n=>"rf"+n),...r.yesHH.map(n=>"hh"+n)].sort().join(",") : ""; }

/* ---------- Step completion ---------- */
const STEPS = [
  {k:"screen", n:"0", t:"Pre-ADAPT Screening", done:p=>p.screen.done},
  {k:"step1", n:"1", t:"Assess", done:p=>!!p.assess.skill.trim()},
  {k:"step2", n:"2", t:"Discover", done:p=>!!p.determine.move.trim()||!!p.determine.none},
  {k:"step3", n:"3", t:"Approach", done:p=>!!(p.approach.pfm.trim()||p.approach.cc.trim())},
  {k:"step4", n:"4", t:"Program", done:p=>!!(p.program.ov.trim()||p.program.skip)},
  {k:"step5", n:"5", t:"Track", done:p=>p.tracking}];
function stepSub(p,k){
  switch(k){
    case "screen": return p.screen.done ? (screenResult(p).any?"Done, with flags":"Done, no flags") : "Red flags and health questions";
    case "step1": return p.assess.skill || `Your ${skillLabel(p)}`;
    case "step2": return p.determine.move || (p.determine.none?"None found yet (flagged)":"Your Testing Movement");
    case "step3": return [p.approach.pfm,p.approach.cc].filter(Boolean).join(" + ") || "Pain-Free Motion and Comfortable Contraction";
    case "step4": return p.program.skip ? "Skipped for now" : (p.program.ov || "Your Overload Exercise");
    case "step5": return p.tracking ? "Tracking" : "How to track";
  }
}
const nextStep = p => STEPS.find(s=>!s.done(p));

V.step2 = () => {
  const p=P(); const d=p.determine;
  return `<div class="stack">
  <div class="card flat"><span class="eyebrow">Step 2</span><h1>Discover: Testing Movement</h1></div>
  <img class="fig" src="img/step2.jpg" alt="Discover your Testing Movement." width="1600" height="1189">
  <div class="card"><p>The purpose of the Testing Movement is to find a reasonable way to determine where you are right now, and, in the future, whether you are progressing, plateauing, or regressing. Your ${esc(skillLabel(p).toLowerCase())} is not a good testing movement, for a number of reasons. It may not be safe to perform due to your injury, or due to pain inhibiting confident performance (ever bailed in the middle of a backflip? Not fun and potentially dangerous). It may also create or reinforce doubt about your ability to successfully perform that skill in the future. It may also be something you need to warm up for, which makes wiggle room from test to test for inconsistency and therefore unreliable results. The Testing Movement avoids all those issues.</p>
  <p class="small muted">${esc(skillLabel(p))}: <b>${esc(p.assess.skill||"not filled in yet")}</b></p></div>
  <div class="card"><h2>Crux of the issue</h2>
  <p class="small">What simpler, smaller, more focused component seems to be preventing free execution of the painful skill task in its entirety? Explore various related movements to determine. For example: from macaco think bridge, from bridge think end-range shoulder flexion; from back flip think squat, from squat think mid-range loaded knee extension when plantarflexed; from cartwheel think left single leg side handstand press, from press think left trunk sidebending. You are trying to boil the painful skill down to its smallest unit, likely the joint position and loading pattern that is painful.</p>
  ${field("The crux of my issue","determine.crux","",{area:true,ph:"ex.: “The crux of the issue is loading my right shoulder, when I’m upside down. I feel this most in macacos or in handstand weight shifts. If I keep the weight balanced between both hands in a bridge, I don’t feel pain.”"})}</div>
  <div class="card"><h2>Testing Movement</h2>

  <div class="rule"><b>Test 1x per week, cold</b><span class="small">Keep the test as reliable as possible: without a warmup and preferably at the same time of day. These details are your starting point; changes to any of them over time will indicate progress, regress, or plateau.</span></div>

  const cols=[["Dose","dose"],["Range","range"],["Load","load"]].filter(([,k])=>rows.some(r=>r[k]));

  `  Start: ${[p.determine.dose,p.determine.range,p.determine.load].filter(Boolean).join(", ")||"-"}${p.determine.nrsop!=null?` | NRSoP ${p.determine.nrsop}/10`:""}`,
  last?`  Latest (${fmtDate(last.date)}): ${[last.dose,last.range,last.load].filter(Boolean).join(", ")||"-"}${last.nrsop!=null?` | NRSoP ${last.nrsop}/10`:""}${last.notes?` | ${last.notes}`:""}`:"  No weekly tests logged yet",

  const ls=p.logs.skill[p.logs.skill.length-1]; if(ls) lines.push(`Skill retest (${fmtDate(ls.date)}): PSFS ${ls.psfs??"-"}/10${ls.trend?` | ${TRENDS.find(x=>x[0]===ls.trend)[1]}`:""}${ls.notes?` | ${ls.notes}`:""}`);
  const r=screenResult(p); if(r.any) lines.push(`Screening flags (${fmtDate(p.screen.date)}): ${[...r.yesRF.map(n=>"red flag "+n+" ("+RED_FLAGS[n-1]+")"),...r.yesHH.map(n=>"health "+n+" ("+HEALTH_SHORT[n-1]+")")].join("; ")}`);
  { const c=progressCheck(p); const ch=c.stalled?changedSince(p,c.epStart).map(x=>MOVES.find(m=>m[0]===x.k)[1]):[];
    if(c.refer) lines.push(`Two-week check: no progress for ${c.checks*2} weekly tests in a row, after 3 exercise changes (follow-up shown)`);
    else if(c.stalled) lines.push(`Two-week check: no progress for ${c.checks*2} weekly tests in a row; suggested now: ${({missing:"find the missing movement",target:"consistency target",change:"exercise change #"+c.rung}[c.step.type])}`);

  { const sl=supportLine(p); if(sl) lines.push(sl); }

}

/* ---------- Learn ---------- */
const learnRaw = () => `<div class="stack">
  <div class="card flat"><span class="eyebrow">Learn</span><h1>The ideas behind ADAPT</h1></div>
  <img class="fig" src="img/five-movements.jpg" alt="The 5 Resilience Movements: Painful Skill, Testing Movement, Pain-Free Motion, Comfortable Contraction, Overload Exercise." width="1600" height="622">
  <details><summary>Introduction</summary><div class="body">
  <p>This guide contains all the information you need to use the ADAPT method independently. Pain and injuries are inevitable parts of any training approach and life in general. Having the tools, and the knowledge for how to use them, to address the inevitable is therefore critically important to rescue and protect your Movement Freedom.</p>
  <p><b>The goal</b> of ADAPT is to help you adapt beyond your previous limitations. It is a uniquely skill-first approach, meaning, the entire process is oriented towards and utilizes the dynamic skills and conditioning routine you cherish and are already using to achieve movement freedom.</p></div></details>
  <details><summary>Prerequisite knowledge</summary><div class="body">
  <p><b>Injury:</b> the tissue damage resulting from tissue overload. Lives in the tissue.</p>
  <p><b>Pain:</b> the negative physical experience frequently associated with injury. Lives in the brain.</p>
  <p><b>Numeric Rating Scale of Pain (NRSoP):</b> 0-10 scale to measure pain intensity. 0 is no pain, 10 is the worst pain.</p>
  <p><b>Patient Specific Functional Scale (PSFS):</b> 0-10 scale to measure your ability to do a specific self-selected task. 0 is completely limited by pain/injury, 10 is completely unlimited by pain/injury. Yes, the PSFS scale is inverted from the NRSoP.</p>
  <p class="small">${esc(PSFS_PAIN)}</p><p class="small">For a Restricted Skill: ${esc(PSFS_RESTR)}</p></div></details>
  <details><summary>Respect but don’t fear your pain</summary><div class="body">
  <ul class="tight"><li><b>Avoiding all pain</b> entirely is fear, and fear feeds danger signals into the brain, which further amplifies the pain response</li>
  <li><b>Ignoring pain</b> and just powering through is disrespecting your pain, and means alarm bells are constantly blaring during your activity, which feeds danger signals into the brain, which further amplifies the pain response</li>
  <li><b>The balance</b> of “respect but don’t fear your pain” means some pain is okay, maybe even good, depending on the context.</li></ul>
  <div class="rule"><b>The pain guidelines: BOTH must be met</b><span>During movement: pain can increase 0-2 points out of 10 ABOVE baseline</span><span>At rest: pain returns to baseline level shortly after</span></div>
  <p class="small">If your pain is normally at a 3/10, then temporarily aggravating your pain to a 5/10 can be tolerable IF between sets/after your practice it returns to a 3/10 or below.</p></div></details>
  <details><summary>Skills-first approach</summary><div class="body"><p>We often fall into a binary mindset when it comes to recovery: “I’m injured so I cannot/should not challenge myself. First recover, then I’ll challenge myself again.” This steals the joy of training and even potentially slows down the healing process. Instead, use what you love to make it love you back. Make your recovery approach as similar and as specific as possible to the training you feel passionate about.</p></div></details>
  <details><summary>Find the victories obscured by the obvious losses</summary><div class="body"><p>It’s easy for us to focus on the negative; what we can’t do, don’t have, used to, should be able to, etc. We have “The One Big Goal” at the end for what success looks like. That’s great, but it means along the way we hate the process, our life, ourselves, because we aren’t THERE yet.</p>
  <p>Instead of just collecting all the negatives and being miserable, use each negative as an opportunity to find countless positives. “I can’t tie my shoes” gets redefined to “I can’t tie my shoes in XYZ-way like I normally do.” Then, explore multiple different ways to solve the problem. All of a sudden, that single, monumental, all-encompassing “I CAN’T,” which defines Movement Restriction, turns into: “Wow, I actually can tie my shoes if I do it in ABC- and DEF- and GHI-way, and I actually like GHI-way better than my usual XYZ-way.” Exploration, optionality, and adaptation are the hallmarks of Movement Freedom.</p></div></details>
  <details><summary>ADAPT beyond your previous limitations</summary><div class="body"><p>Your final destination is not merely to get back to where you were before the pain/injury; aim to get beyond that point. After every valley, we climb ever higher mountains. This is the essence of Movement Freedom. It is an adaptive mindset, through which we become more resilient with every injury. Our abilities expand as we age and collect more experience.</p>
  <p>In your own movement practice, you’ve likely (read: definitely) experienced pain and injuries multiple times. The purpose of the ADAPT method for resilience is to give you, when the inevitable happens, a different path to take that will finally aid you in achieving your version of Movement Freedom, instead of perpetuating the usual cycles we all fall into.</p></div></details>
  <details><summary>The 3 vicious cycles of injury management</summary><div class="body">
  <p>There are three common approaches to dealing with training-related injuries and pain: pushing through, avoiding, and fixing. You likely have found yourself on one, if not all, of these paths before.</p>
  <p><b>The first path</b> leads down the vicious cycle of pushing through. This approach has a number of issues. It negatively impacts the tissues because it progresses the injury. It negatively impacts the brain because it reinforces that certain movements are painful and therefore “dangerous.” It also doesn’t take care of the underlying patterns that caused the injury in the first place, so even if the pain goes down, the cycle will continue. It is the most immature approach in that it works better the younger we are, with progressively less effectiveness the older we become. At some point the injuries become too severe or accumulate to the point where ignoring them no longer does the trick. That’s when people usually turn to the second path.</p>
  <p><b>The second path</b>, avoiding pain, seems like a more measured and mature approach on the surface, and logically makes a lot of sense. Unfortunately, it too has a number of issues. It negatively impacts the tissues because our bodies work by the principle of “use it or lose it;” by avoiding the movement our body becomes less capable of performing the movement. It negatively impacts the brain because it still teaches our brain to associate certain movements with pain and therefore those movements must be “dangerous.” This in turn can lead to chronic pain and possibly depression. It, too, doesn’t take care of the underlying pattern that led to the injury in the first place. This finally leads to the third path.</p>
  <p><b>The third path</b>, finding the fix, is a categorical improvement over the first two. We acknowledge something is wrong AND we try to address it. Yet again, though, it comes along with its own significant issues. It can negatively impact the tissues through unnecessary, unhelpful, and even harmful treatments. It negatively impacts the brain because doggedly pursuing the perfect fix reinforces there must therefore be a problem that requires fixing. Problems are bad, bad is dangerous, therefore we hyperfocus on every sensation related to our painful area, which can make us feel worse and make poor decisions about what we should do to address the sensations. It also frequently puts the fix into the hands of someone/thing external to the person. Until that someone/thing is found, there isn’t anything to do about the problem, which gives the problem the opportunity to gain permanence. On top of all that, like the previous paths, it often doesn’t take care of the underlying pattern that led to the injury in the first place.</p></div></details>
  <details><summary>The virtuous cycle: introducing ADAPT</summary><div class="body">
  <p>When all the usual paths don’t work or have significant downsides, it’s time to forge a new path that avoids those problems and actually gets you where you want to go. It’s finally time to say hello to the ADAPT Method.</p>
  <p>The ADAPT Method consists of 5 separate steps in which you will discover your <b>5 Resilience Movements</b>. This individualized approach makes the method hyper-specific to your body and your goals, and it is how you will break new ground, instead of getting stuck in recurring injury loops. The first two steps deal with your current discomfort: we don’t ignore, or avoid or try to ‘fix’ the pain; we use it as a guiding light. From step three onwards you will discover what you can already do and use that to move you in the right direction (pun intended).</p>
  <p>You can determine all 5 resilience movements within an hour. In principle, you can even complete all 5 steps by yourself, but many people will feel relief and support through working with a professional. The purpose of the professional is to monitor your progress and suggest alternative routes in an instant, where you otherwise might have driven in circles before finding a better resilience movement to get you past the finish line.</p>
  <img class="fig" src="img/journey.jpg" alt="The resilience journey in a nutshell, steps 1 through 5." width="1000" height="794"></div></details>
  <details><summary>The 5 Resilience Movements and the pain-intensity continuum</summary><div class="body">
  <p>The 5 resilience movements each have a universal and a personal dimension. <b>The universal dimension:</b> Painful Skill, Testing Movement, Pain-Free Motion, Comfortable Contraction, and Overload Exercise. <b>The personal dimension:</b> the specific movements that go into each category are 100% customized to fit you and your unique situation. There aren’t “shoulder” exercises, “back” exercises, etc.; there are only “your” exercises.</p>
  <p class="fine">If the label of “pain” isn’t connecting with you, we’ve all got a weak link that’s holding us back from a skill we want; just swap that language in your mind whenever it comes up.</p>
  <p>In order for our method to reliably work for people with elbow tendonitis, chronic back pain, and a strained knee ligament, we need to cover the entire range of pain-intensity. No matter where you are or how functionally limited you are currently, we can gradually progress you through the low-intensity to high-intensity continuum, along the way utilizing pain as the useful warning light it is supposed to be.</p>
  <img class="fig" src="img/continuum.jpg" alt="The pain-intensity continuum of the five Resilience Movements, from Pain-Free Motion to the Painful Skill." width="1600" height="1098">
  <p>On the left, we have a low intensity, Pain-Free Motion, often assisted by a prop like a band, a wall, or your hand to allow pain-free exploration. On the right is your painful skill. The goal: color the entire band green, which means you have reached high intensity, pain-free movement!</p>
  <img class="fig" src="img/before-after.jpg" alt="Before ADAPT the band runs from no pain to high pain; after ADAPT it is green all the way." width="1600" height="678"></div></details>
  <details><summary>Resilience is a journey</summary><div class="body">
  <p>Everyone can find their <b>ideal</b> Testing Movement, Pain-Free Motion, Comfortable Contraction, and Overload Exercise. But finding them can take time. Your first guess for your Pain-Free Motion might fail. You may think “There is nothing I can do right now. My back just hurts when I extend it, period,” and feel defeated.</p>
  <p>Or you could stay curious, explore lying on your back, hands folded behind your lumbar spine, take a deep breath, and finally feel a big wave of release wash over you as the pain subsides for the first time in days. Resilience is a skill. So is getting to know your body and your injuries. Skills take practice, work, and time to develop, but these skills are likely the most important for your overall movement career.</p>
  <p>As you explore, you may need to modify your Pain-Free Motion. Your Comfortable Contraction might need repeated positional adjustments. Your Overload exercise may need to be changed. You don’t need to know the exact architecture and anatomy of your body, but you need to stay curious and keep track of your progress. Slow or non-existent? Then try turning your foot 15 degrees outwards. Or pull your arm more in towards your midline. Or bend the arm a little less during the chin-up hold.</p>
  <p>Don’t expect every step will be in the right direction, but expect that you will arrive as long as you continue to Assess, Discover, Approach, Program, Track.</p></div></details>
  ${legal()}
  </div>`;

function rerenderKeepInputs(){ // keep typed values in log forms when tapping a scale

function showFallback(text){ const el=document.createElement("div"); el.className="card"; el.innerHTML=`<p class="small">Copy this:</p><textarea readonly style="min-height:120px">${esc(text)}</textarea>`; document.getElementById("app").appendChild(el); const ta=el.querySelector("textarea"); ta.focus(); ta.select(); el.scrollIntoView({block:"center"}); }

// Week counter and a renewal heads-up at week 10 (Sam, October 27, 2026)
function supportInfo(p){ if(!p||p.support!=="sam"||p.origin==="coach") return null; const s=p.supportStart||p.trackStart||p.created; const d=daysBetween(s,today());
  return { week:Math.min(12,Math.floor(d/7)+1), end:addDays(s,SUPPORT_DAYS), days:d, start:s }; }
function supportLine(p){ const i=supportInfo(p); return i?`Direct support: week ${i.week} of 12 (through ${fmtDate(addDays(i.end,-1))})`:""; }
function supportCheck(p){ if(!p||p.support!=="sam"||p.origin==="coach") return; const s=p.supportStart||p.trackStart||p.created;
  if(daysBetween(s,today())>=70 && daysBetween(s,today())<SUPPORT_DAYS){ p.notified=p.notified||{}; if(p.notified.renewal!==s){ p.notified.renewal=s; save(true); queueFlag(p,"Renewal in 2 weeks"); } }
  if(daysBetween(s,today())>=SUPPORT_DAYS){ p.support="self"; p.supportEnded=today(); delete p.supportEndedSeen; save(true); } }
function supportEndedCard(p){ if(!p.supportEnded||p.supportEndedSeen||p.support==="sam") return "";
  return `<div class="msg info"><p class="small">Your 12 weeks of direct support with Sam have ended. Your plan and tracking stay here and keep working, just without automatic notices to Sam. To keep working with him, email Sam at ${emailLink()}.</p><button class="btn small plain" data-act="support-ended-ok">Got it</button></div>`; }
function renewSupport(d){ const p=store.plans[d.renew]; clearHash();
  if(!p){ toast("This renewal link is for a plan that isn't on this device"); render(); return; }
  p.support="sam"; if(p.origin==="coach") p.origin="self"; p.supportStart=today(); delete p.supportEnded; delete p.supportEndedSeen;
  store.activeId=p.id; save(true); go("home"); toast("Direct support with Sam renewed for 12 weeks"); }
async function openCode(raw){
  try{ const kindMatch=raw.match(/#([cpr])=/); const d=await unpack(raw);
    if(d && d.renew){ renewSupport(d); return; }
    if(!d || !d.assess) throw new Error("bad");
    const isCheckin = kindMatch ? kindMatch[1]==="c" : !!d._sent;
    if(isCheckin){ coachData=d; go("coach"); } else { importData=d; go("import"); }
  }catch(e){ toast("That link or code couldn't be read"); render(); }
}

window.addEventListener("hashchange", ()=>{ if(/^#[cpr]=/.test(location.hash)) openCode(location.hash); });
/* ---------- Boot ---------- */
load();
flushFlags(); flushData();
(async()=>{
  const h=location.hash; const startView = store.activeId ? "home" : "welcome";
  try{ history.replaceState({view:startView}, "", baseURL()); }catch(e){}
  if(/^#[cpr]=/.test(h)){ view=startView; await openCode(h); }
  else { view = startView; render(); }
})();
if("serviceWorker" in navigator && /^https?:$/.test(location.protocol)){ navigator.serviceWorker.register("sw.js").catch(()=>{}); }
</script>
